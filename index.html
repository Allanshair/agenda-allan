<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agenda Allan</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --card2: #1d1d1d;
      --border: #2a2a2a;
      --text: #f2f2f2;
      --muted: #9c9c9c;
      --gold: #d4af37;
      --gold-light: #f0c75e;
      --gold-dark: #a8872a;
      --danger: #e5484d;
      --success: #30a46c;
      --info: #3b82f6;
      --warning: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 70px;
    }

    button { cursor: pointer; font-family: inherit; border: none; }
    input, select, textarea {
      font-family: inherit; width: 100%; padding: 12px 14px;
      background: var(--card2); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; font-size: 15px;
      outline: none; transition: border .2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }

    .btn {
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      color: #1a1400; font-weight: 700; font-size: 15px;
      padding: 12px 18px; border-radius: 12px; transition: transform .1s, opacity .2s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-outline {
      background: transparent; color: var(--gold); border: 1.5px solid var(--gold);
      font-weight: 600; padding: 11px 16px; border-radius: 12px;
    }
    .btn-danger { background: var(--danger); color: #fff; font-weight: 600; }
    .btn-small { padding: 7px 12px; font-size: 13px; border-radius: 9px; }

    /* ===== LOGIN ===== */
    #loginScreen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .login-card {
      width: 100%; max-width: 400px; background: var(--card);
      border: 1px solid var(--border); border-radius: 20px; padding: 28px;
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo .icone { font-size: 44px; }
    .logo h1 { font-size: 26px; color: var(--gold); letter-spacing: 1px; }
    .logo p { color: var(--muted); font-size: 14px; }
    .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 18px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .link { color: var(--gold); font-weight: 600; cursor: pointer; }
    .msg-erro { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }

    /* ===== HEADER ===== */
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(10,10,10,.9); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
    }
    header h1 { font-size: 19px; color: var(--gold); letter-spacing: .5px; }
    header .user { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--card2);
      border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--gold); font-size: 15px;
    }
    .btn-sair { background: transparent; color: var(--muted); font-size: 13px; }

    /* ===== MAIN ===== */
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    section h2 { font-size: 18px; margin-bottom: 14px; }

    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
    .toolbar .btn { white-space: nowrap; }
    .toolbar input, .toolbar select { flex: 1; }

    /* ===== CARDS ===== */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 10px;
    }
    .card-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card-title { font-weight: 700; font-size: 15px; }
    .card-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .card .acoes { display: flex; gap: 6px; }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    }
    .badge-agendado { background: rgba(59,130,246,.15); color: var(--info); }
    .badge-confirmado { background: rgba(245,158,11,.15); color: var(--warning); }
    .badge-concluido { background: rgba(48,164,108,.15); color: var(--success); }
    .badge-cancelado { background: rgba(229,72,77,.15); color: var(--danger); }
    .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; }

    /* ===== FINANCEIRO ===== */
    .fin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .fin-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    }
    .fin-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    .fin-card .valor { font-size: 22px; font-weight: 800; margin-top: 6px; }
    .fin-card.total { grid-column: span 2; border-color: var(--gold); background: linear-gradient(135deg, #171204, #141414); }
    .fin-card.total .valor { color: var(--gold); font-size: 26px; }

    /* ===== BOTTOM NAV ===== */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: rgba(14,14,14,.95); backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 8px 4px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }
    nav button {
      background: transparent; color: var(--muted); font-size: 11px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 12px;
    }
    nav button .nav-ico { font-size: 22px; }
    nav button.ativo { color: var(--gold); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal {
      background: var(--card); width: 100%; max-width: 640px;
      border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto;
      animation: subir .2s ease;
    }
    @keyframes subir { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
    .modal h3 { color: var(--gold); margin-bottom: 6px; }
    .modal .modal-acoes { display: flex; gap: 10px; margin-top: 20px; }
    .modal .modal-acoes .btn { flex: 1; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .checkbox-line { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
    .checkbox-line input { width: auto; }
    .checkbox-line label { margin: 0; color: var(--text); font-size: 14px; }
  </style>
</head>
<body>

  <!-- ================= LOGIN / CADASTRO ================= -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="logo">
        <div class="icone">💈</div>
        <h1>Agenda Allan</h1>
        <p>Gestão completa do seu salão</p>
      </div>

      <!-- Login -->
      <div id="formLogin">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
        <label>Senha</label>
        <input type="password" id="loginSenha" placeholder="••••••••" autocomplete="current-password">
        <div class="msg-erro" id="msgLogin"></div>
        <button class="btn" id="btnLogin" style="width:100%; margin-top:12px;">Entrar</button>
        <div class="divider">ou</div>
        <button class="btn-outline" id="btnGoogle" style="width:100%;">🔑 Entrar com Google</button>
        <p style="text-align:center; margin-top:18px; color:var(--muted); font-size:14px;">
          Não tem conta? <span class="link" id="btnMostrarCadastro">Cadastre-se</span>
        </p>
      </div>

      <!-- Cadastro -->
      <div id="formCadastro" hidden>
        <label>Nome</label>
        <input type="text" id="regNome" placeholder="Seu nome" autocomplete="name">
        <label>E-mail</label>
        <input type="email" id="regEmail" placeholder="seu@email.com" autocomplete="email">
        <label>Senha (mínimo 6 caracteres)</label>
        <input type="password" id="regSenha" placeholder="••••••••" autocomplete="new-password">
        <div class="msg-erro" id="msgCadastro"></div>
        <button class="btn" id="btnRegistrar" style="width:100%; margin-top:12px;">Criar conta</button>
        <p style="text-align:center; margin-top:18px; color:var(--muted); font-size:14px;">
          Já tem conta? <span class="link" id="btnMostrarLogin">Entrar</span>
        </p>
      </div>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="appScreen" hidden>
    <header>
      <h1>💈 Agenda Allan</h1>
      <div class="user">
        <span class="avatar" id="avatarUser">A</span>
        <button class="btn-sair" id="btnSair">Sair</button>
      </div>
    </header>

    <main>
      <!-- AGENDA -->
      <section id="secaoAgenda">
        <h2>📅 Agenda</h2>
        <div class="toolbar">
          <input type="date" id="filtroData">
          <button class="btn" id="btnAddAgendamento">+ Agendar</button>
        </div>
        <div id="listaAgendamentos"></div>
      </section>

      <!-- PRODUTOS -->
      <section id="secaoProdutos" hidden>
        <h2>🛍️ Produtos</h2>
        <div class="toolbar">
          <button class="btn" id="btnAddProduto" style="width:100%;">+ Novo Produto</button>
        </div>
        <div id="listaProdutos"></div>
      </section>

      <!-- FINANCEIRO -->
      <section id="secaoFinanceiro" hidden>
        <h2>💰 Financeiro</h2>
        <div class="toolbar">
          <select id="filtroMes"></select>
        </div>
        <div class="fin-grid">
          <div class="fin-card">
            <div class="label">💇 Serviços</div>
            <div class="valor" id="finServicos">R$ 0,00</div>
          </div>
          <div class="fin-card">
            <div class="label">🛍️ Produtos</div>
            <div class="valor" id="finProdutos">R$ 0,00</div>
          </div>
          <div class="fin-card total">
            <div class="label">💎 Total</div>
            <div class="valor" id="finTotal">R$ 0,00</div>
          </div>
        </div>
      </section>

      <!-- EQUIPE -->
      <section id="secaoEquipe" hidden>
        <h2>👥 Equipe</h2>
        <div class="toolbar">
          <button class="btn" id="btnAddProfissional" style="width:100%;">+ Profissional</button>
        </div>
        <div id="listaProfissionais"></div>
      </section>
    </main>

    <!-- BOTTOM NAV -->
    <nav>
      <button id="navAgenda" class="ativo"><span class="nav-ico">📅</span>Agenda</button>
      <button id="navProdutos"><span class="nav-ico">🛍️</span>Produtos</button>
      <button id="navFinanceiro"><span class="nav-ico">💰</span>Financeiro</button>
      <button id="navEquipe"><span class="nav-ico">👥</span>Equipe</button>
    </nav>
  </div>

  <!-- ================= MODAL AGENDAMENTO ================= -->
  <div class="modal-overlay" id="modalAgendamento" hidden>
    <div class="modal">
      <h3 id="tituloAgendamento">Novo Agendamento</h3>
      <input type="hidden" id="agId">
      <div class="row-2">
        <div>
          <label>Data</label>
          <input type="date" id="agData">
        </div>
        <div>
          <label>Hora</label>
          <input type="time" id="agHora">
        </div>
      </div>
      <label>Cliente</label>
      <input type="text" id="agCliente" placeholder="Nome do cliente">
      <label>Serviço</label>
      <input type="text" id="agServico" placeholder="Ex: Corte, Coloração...">
      <label>Valor (R$)</label>
      <input type="number" id="agValor" placeholder="0,00" step="0.01" min="0">
      <label>Profissional (quem atendeu)</label>
      <select id="agProfissional"><option value="">— Não definido —</option></select>
      <label>Status</label>
      <select id="agStatus">
        <option value="agendado">Agendado</option>
        <option value="confirmado">Confirmado</option>
        <option value="concluido">Concluído</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <div class="modal-acoes">
        <button class="btn-outline" id="btnFecharAgendamento">Cancelar</button>
        <button class="btn" id="btnSalvarAgendamento">Salvar</button>
      </div>
      <button class="btn-danger btn-small" id="btnExcluirAgendamento" style="margin-top:14px; width:100%;" hidden>Excluir</button>
    </div>
  </div>

  <!-- ================= MODAL PRODUTO ================= -->
  <div class="modal-overlay" id="modalProduto" hidden>
    <div class="modal">
      <h3 id="tituloProduto">Novo Produto</h3>
      <input type="hidden" id="prodId">
      <label>Nome do produto</label>
      <input type="text" id="prodNome" placeholder="Ex: Shampoo, Cera...">
      <div class="row-2">
        <div>
          <label>Custo (R$)</label>
          <input type="number" id="prodCusto" placeholder="0,00" step="0.01" min="0">
        </div>
        <div>
          <label>Venda (R$)</label>
          <input type="number" id="prodVenda" placeholder="0,00" step="0.01" min="0">
        </div>
      </div>
      <label>Estoque</label>
      <input type="number" id="prodEstoque" placeholder="0" min="0">
      <div class="modal-acoes">
        <button class="btn-outline" id="btnFecharProduto">Cancelar</button>
        <button class="btn" id="btnSalvarProduto">Salvar</button>
      </div>
      <button class="btn-danger btn-small" id="btnExcluirProduto" style="margin-top:14px; width:100%;" hidden>Excluir</button>
    </div>
  </div>

  <!-- ================= MODAL VENDA ================= -->
  <div class="modal-overlay" id="modalVenda" hidden>
    <div class="modal">
      <h3>Registrar Venda</h3>
      <input type="hidden" id="vendaProdutoId">
      <p class="card-sub" id="vendaProdutoInfo" style="margin-bottom:8px;"></p>
      <label>Quantidade</label>
      <input type="number" id="vendaQtd" value="1" min="1">
      <label>Profissional (quem vendeu)</label>
      <select id="vendaProfissional"><option value="">— Não definido —</option></select>
      <div class="modal-acoes">
        <button class="btn-outline" id="btnFecharVenda">Cancelar</button>
        <button class="btn" id="btnConfirmarVenda">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL PROFISSIONAL ================= -->
  <div class="modal-overlay" id="modalProfissional" hidden>
    <div class="modal">
      <h3 id="tituloProfissional">Novo Profissional</h3>
      <input type="hidden" id="profId">
      <label>Nome</label>
      <input type="text" id="profNome" placeholder="Nome completo">
      <label>Cargo / Função</label>
      <input type="text" id="profCargo" placeholder="Ex: Cabeleireiro, Barbeiro, Manicure..." list="listaCargos">
      <datalist id="listaCargos">
        <option value="Cabeleireiro"></option>
        <option value="Barbeiro"></option>
        <option value="Manicure"></option>
        <option value="Esteticista"></option>
        <option value="Maquiador(a)"></option>
        <option value="Depilador(a)"></option>
        <option value="Dono/Gerente"></option>
      </datalist>
      <label>Telefone (opcional)</label>
      <input type="tel" id="profTelefone" placeholder="(11) 99999-9999">
      <div class="row-2">
        <div>
          <label>Comissão Serviço (%)</label>
          <input type="number" id="profComServico" value="40" min="0" max="100" step="0.5">
        </div>
        <div>
          <label>Comissão Produto (%)</label>
          <input type="number" id="profComProduto" value="10" min="0" max="100" step="0.5">
        </div>
      </div>
      <div class="checkbox-line">
        <input type="checkbox" id="profIsDono">
        <label for="profIsDono">É dono/gerente (não recebe comissão)</label>
      </div>
      <div class="modal-acoes">
        <button class="btn-outline" id="btnFecharProfissional">Cancelar</button>
        <button class="btn" id="btnSalvarProfissional">Salvar</button>
      </div>
      <button class="btn-danger btn-small" id="btnExcluirProfissional" style="margin-top:14px; width:100%;" hidden>Excluir</button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
   /* ============ FIREBASE INIT ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCzT95SdBEzOvinTFf_44Qk7-jLM-IUeJM",
  authDomain: "agenda-allan-cc442.firebaseapp.com",
  projectId: "agenda-allan-cc442",
  storageBucket: "agenda-allan-cc442.firebasestorage.app",
  messagingSenderId: "646440000610",
  appId: "1:646440000610:web:229a36825e92fe24b0c53b"
};
firebase.initializeApp(firebaseConfig);
const AUTH = firebase.auth();
const FDB = firebase.firestore();    

    // ============================================================
    // ESTADO GLOBAL
    // ============================================================
    const state = {
      usuario: null,
      agendamentos: [],
      produtos: [],
      vendas: [],
      profissionais: [],
      filtroMes: 'todos'
    };

    // ============================================================
    // UTILITÁRIOS
    // ============================================================
    function formatarMoeda(v) {
      const n = Number(v) || 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }
    function formatarData(iso) {
      if (!iso) return '';
      const [a, m, d] = iso.split('-');
      return `${d}/${m}/${a}`;
    }
    function hoje() {
      return new Date().toISOString().split('T')[0];
    }
    function mesDe(iso) {
      return iso ? iso.slice(0, 7) : '';
    }
    function inicial(nome) {
      return nome ? nome.charAt(0).toUpperCase() : '?';
    }

    // ============================================================
    // AUTH
    // ============================================================
    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');

    auth.onAuthStateChanged(user => {
      if (user) {
        state.usuario = user;
        loginScreen.hidden = true;
        appScreen.hidden = false;
        document.getElementById('avatarUser').textContent = inicial(user.displayName || user.email);
        iniciarApp(user.uid);
      } else {
        state.usuario = null;
        loginScreen.hidden = false;
        appScreen.hidden = true;
      }
    });

    document.getElementById('btnLogin').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const senha = document.getElementById('loginSenha').value;
      document.getElementById('msgLogin').textContent = '';
      try {
        await auth.signInWithEmailAndPassword(email, senha);
      } catch (e) {
        document.getElementById('msgLogin').textContent = erroMsg(e);
      }
    });

    document.getElementById('btnRegistrar').addEventListener('click', async () => {
      const nome = document.getElementById('regNome').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const senha = document.getElementById('regSenha').value;
      document.getElementById('msgCadastro').textContent = '';
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, senha);
        await cred.user.updateProfile({ displayName: nome });
      } catch (e) {
        document.getElementById('msgCadastro').textContent = erroMsg(e);
      }
    });

    document.getElementById('btnGoogle').addEventListener('click', async () => {
      document.getElementById('msgLogin').textContent = '';
      try {
        await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      } catch (e) {
        document.getElementById('msgLogin').textContent = erroMsg(e);
      }
    });

    document.getElementById('btnSair').addEventListener('click', () => auth.signOut());

    document.getElementById('btnMostrarCadastro').addEventListener('click', () => {
      document.getElementById('formLogin').hidden = true;
      document.getElementById('formCadastro').hidden = false;
    });
    document.getElementById('btnMostrarLogin').addEventListener('click', () => {
      document.getElementById('formCadastro').hidden = true;
      document.getElementById('formLogin').hidden = false;
    });

    function erroMsg(e) {
      const map = {
        'auth/invalid-email': 'E-mail inválido.',
        'auth/user-not-found': 'Usuário não encontrado.',
        'auth/wrong-password': 'Senha incorreta.',
        'auth/email-already-in-use': 'Este e-mail já está cadastrado.',
        'auth/weak-password': 'Senha muito fraca (mínimo 6 caracteres).',
        'auth/popup-closed-by-user': 'Login com Google cancelado.'
      };
      return map[e.code] || 'Erro ao processar. Tente novamente.';
    }

    // ============================================================
    // NAVEGAÇÃO
    // ============================================================
    const secoes = {
      agenda: document.getElementById('secaoAgenda'),
      produtos: document.getElementById('secaoProdutos'),
      financeiro: document.getElementById('secaoFinanceiro'),
      equipe: document.getElementById('secaoEquipe')
    };
    const navBotoes = {
      agenda: document.getElementById('navAgenda'),
      produtos: document.getElementById('navProdutos'),
      financeiro: document.getElementById('navFinanceiro'),
      equipe: document.getElementById('navEquipe')
    };

    function navegar(secao) {
      Object.keys(secoes).forEach(k => {
        secoes[k].hidden = (k !== secao);
        navBotoes[k].classList.toggle('ativo', k === secao);
      });
    }
    Object.keys(navBotoes).forEach(k => {
      navBotoes[k].addEventListener('click', () => navegar(k));
    });

    // ============================================================
    // INICIAR APP + LISTENERS FIRESTORE + MIGRAÇÃO
    // ============================================================
    let listenersAtivos = [];

    async function iniciarApp(uid) {
      document.getElementById('filtroData').value = hoje();
      limparListeners();
      montarFiltroMeses();

      const base = db.collection('users').doc(uid);

      // Migração do localStorage (primeira vez)
      await migrarDadosAntigos(base);

      // Listener agendamentos
      const l1 = base.collection('agendamentos').orderBy('data').onSnapshot(snap => {
        state.agendamentos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAgenda();
        renderFinanceiro();
      });

      // Listener produtos
      const l2 = base.collection('produtos').orderBy('nome').onSnapshot(snap => {
        state.produtos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderProdutos();
      });

      // Listener vendas
      const l3 = base.collection('vendas').orderBy('data', 'desc').onSnapshot(snap => {
        state.vendas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderFinanceiro();
      });

      // Listener profissionais
      const l4 = base.collection('profissionais').orderBy('nome').onSnapshot(snap => {
        state.profissionais = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderEquipe();
        popularSelectProfissionais();
      });

      listenersAtivos = [l1, l2, l3, l4];
    }

    function limparListeners() {
      listenersAtivos.forEach(l => l && l());
      listenersAtivos = [];
    }

    async function migrarDadosAntigos(base) {
      const configSnap = await base.collection('config').doc('geral').get();
      if (configSnap.exists && configSnap.data().migrado) return;

      const oldAg = JSON.parse(localStorage.getItem('agendamentos') || '[]');
      const oldPr = JSON.parse(localStorage.getItem('produtos') || '[]');

      const batch = db.batch();
      oldAg.forEach(a => {
        const ref = base.collection('agendamentos').doc();
        batch.set(ref, a);
      });
      oldPr.forEach(p => {
        const ref = base.collection('produtos').doc();
        batch.set(ref, p);
      });
      batch.set(base.collection('config').doc('geral'), { migrado: true, quando: firebase.firestore.FieldValue.serverTimestamp() });
      await batch.commit();

      if (oldAg.length || oldPr.length) {
        localStorage.removeItem('agendamentos');
        localStorage.removeItem('produtos');
      }
    }

    // ============================================================
    // AGENDA
    // ============================================================
    function renderAgenda() {
      const lista = document.getElementById('listaAgendamentos');
      const filtro = document.getElementById('filtroData').value;
      const itens = state.agendamentos
        .filter(a => !filtro || a.data === filtro)
        .sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));

      if (!itens.length) {
        lista.innerHTML = '<div class="empty">Nenhum agendamento para esta data.</div>';
        return;
      }

      lista.innerHTML = itens.map(a => {
        const prof = state.profissionais.find(p => p.id === a.profissionalId);
        const statusClasse = `badge-${a.status}`;
        return `
          <div class="card">
            <div class="card-row">
              <div>
                <div class="card-title">${a.cliente || 'Cliente'}</div>
                <div class="card-sub">🕐 ${a.hora || '--'} · ${a.servico || '—'}</div>
                <div class="card-sub">${prof ? '👤 ' + prof.nome : ''}</div>
              </div>
              <div style="text-align:right;">
                <span class="badge ${statusClasse}">${a.status}</span>
                <div class="card-title" style="color:var(--gold); margin-top:6px;">${formatarMoeda(a.valor)}</div>
              </div>
            </div>
            <div style="display:flex; gap:6px; margin-top:10px;">
              <button class="btn-outline btn-small" onclick="editarAgendamento('${a.id}')">Editar</button>
              ${a.status !== 'concluido' ? `<button class="btn btn-small" onclick="concluirAgendamento('${a.id}')">Concluir</button>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('filtroData').addEventListener('change', renderAgenda);
    document.getElementById('btnAddAgendamento').addEventListener('click', () => abrirModalAgendamento());

    function abrirModalAgendamento(dados = {}) {
      document.getElementById('tituloAgendamento').textContent = dados.id ? 'Editar Agendamento' : 'Novo Agendamento';
      document.getElementById('agId').value = dados.id || '';
      document.getElementById('agData').value = dados.data || document.getElementById('filtroData').value || hoje();
      document.getElementById('agHora').value = dados.hora || '09:00';
      document.getElementById('agCliente').value = dados.cliente || '';
      document.getElementById('agServico').value = dados.servico || '';
      document.getElementById('agValor').value = dados.valor ?? '';
      document.getElementById('agStatus').value = dados.status || 'agendado';
      document.getElementById('agProfissional').value = dados.profissionalId || '';
      document.getElementById('btnExcluirAgendamento').hidden = !dados.id;
      popularSelectProfissionais();
      document.getElementById('modalAgendamento').hidden = false;
    }

    function editarAgendamento(id) {
      const a = state.agendamentos.find(x => x.id === id);
      if (a) abrirModalAgendamento(a);
    }

    async function concluirAgendamento(id) {
      const ref = db.collection('users').doc(state.usuario.uid).collection('agendamentos').doc(id);
      await ref.update({ status: 'concluido' });
    }

    document.getElementById('btnSalvarAgendamento').addEventListener('click', async () => {
      const id = document.getElementById('agId').value;
      const dados = {
        data: document.getElementById('agData').value,
        hora: document.getElementById('agHora').value,
        cliente: document.getElementById('agCliente').value.trim(),
        servico: document.getElementById('agServico').value.trim(),
        valor: Number(document.getElementById('agValor').value) || 0,
        status: document.getElementById('agStatus').value,
        profissionalId: document.getElementById('agProfissional').value || ''
      };
      if (!dados.data || !dados.cliente) {
        alert('Preencha ao menos a data e o nome do cliente.');
        return;
      }
      const base = db.collection('users').doc(state.usuario.uid).collection('agendamentos');
      if (id) await base.doc(id).update(dados);
      else await base.add(dados);
      document.getElementById('modalAgendamento').hidden = true;
    });

    document.getElementById('btnExcluirAgendamento').addEventListener('click', async () => {
      const id = document.getElementById('agId').value;
      if (id && confirm('Excluir este agendamento?')) {
        await db.collection('users').doc(state.usuario.uid).collection('agendamentos').doc(id).delete();
        document.getElementById('modalAgendamento').hidden = true;
      }
    });
    document.getElementById('btnFecharAgendamento').addEventListener('click', () => {
      document.getElementById('modalAgendamento').hidden = true;
    });

    // ============================================================
    // PRODUTOS
    // ============================================================
    function renderProdutos() {
      const lista = document.getElementById('listaProdutos');
      if (!state.produtos.length) {
        lista.innerHTML = '<div class="empty">Nenhum produto cadastrado.</div>';
        return;
      }
      lista.innerHTML = state.produtos.map(p => {
        const margem = p.venda > 0 ? ((p.venda - p.custo) / p.venda * 100) : 0;
        return `
          <div class="card">
            <div class="card-row">
              <div>
                <div class="card-title">${p.nome}</div>
                <div class="card-sub">Custo ${formatarMoeda(p.custo)} · Venda ${formatarMoeda(p.venda)}</div>
                <div class="card-sub">📦 Estoque: ${p.estoque ?? 0} · Margem ${margem.toFixed(0)}%</div>
              </div>
              <div style="text-align:right;">
                <div class="card-title" style="color:var(--gold);">${formatarMoeda(p.venda)}</div>
                <div style="display:flex; gap:5px; margin-top:8px;">
                  <button class="btn btn-small" onclick="abrirVenda('${p.id}')">Vender</button>
                  <button class="btn-outline btn-small" onclick="editarProduto('${p.id}')">Editar</button>
                </div>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('btnAddProduto').addEventListener('click', () => abrirModalProduto());

    function abrirModalProduto(dados = {}) {
      document.getElementById('tituloProduto').textContent = dados.id ? 'Editar Produto' : 'Novo Produto';
      document.getElementById('prodId').value = dados.id || '';
      document.getElementById('prodNome').value = dados.nome || '';
      document.getElementById('prodCusto').value = dados.custo ?? '';
      document.getElementById('prodVenda').value = dados.venda ?? '';
      document.getElementById('prodEstoque').value = dados.estoque ?? 0;
      document.getElementById('btnExcluirProduto').hidden = !dados.id;
      document.getElementById('modalProduto').hidden = false;
    }

    function editarProduto(id) {
      const p = state.produtos.find(x => x.id === id);
      if (p) abrirModalProduto(p);
    }

    document.getElementById('btnSalvarProduto').addEventListener('click', async () => {
      const id = document.getElementById('prodId').value;
      const dados = {
        nome: document.getElementById('prodNome').value.trim(),
        custo: Number(document.getElementById('prodCusto').value) || 0,
        venda: Number(document.getElementById('prodVenda').value) || 0,
        estoque: Number(document.getElementById('prodEstoque').value) || 0
      };
      if (!dados.nome) { alert('Informe o nome do produto.'); return; }
      const base = db.collection('users').doc(state.usuario.uid).collection('produtos');
      if (id) await base.doc(id).update(dados);
      else await base.add(dados);
      document.getElementById('modalProduto').hidden = true;
    });

    document.getElementById('btnExcluirProduto').addEventListener('click', async () => {
      const id = document.getElementById('prodId').value;
      if (id && confirm('Excluir este produto?')) {
        await db.collection('users').doc(state.usuario.uid).collection('produtos').doc(id).delete();
        document.getElementById('modalProduto').hidden = true;
      }
    });
    document.getElementById('btnFecharProduto').addEventListener('click', () => {
      document.getElementById('modalProduto').hidden = true;
    });

    // ============================================================
    // VENDAS
    // ============================================================
    function abrirVenda(produtoId) {
      const p = state.produtos.find(x => x.id === produtoId);
      if (!p) return;
      document.getElementById('vendaProdutoId').value = p.id;
      document.getElementById('vendaProdutoInfo').textContent =
        `${p.nome} — ${formatarMoeda(p.venda)} · Estoque: ${p.estoque ?? 0}`;
      document.getElementById('vendaQtd').value = 1;
      document.getElementById('vendaProfissional').value = '';
      popularSelectProfissionais();
      document.getElementById('modalVenda').hidden = false;
    }

    document.getElementById('btnConfirmarVenda').addEventListener('click', async () => {
      const produtoId = document.getElementById('vendaProdutoId').value;
      const p = state.produtos.find(x => x.id === produtoId);
      if (!p) return;
      const qtd = Math.max(1, Number(document.getElementById('vendaQtd').value) || 1);
      if ((p.estoque ?? 0) < qtd) { alert('Estoque insuficiente.'); return; }

      const base = db.collection('users').doc(state.usuario.uid);
      await base.collection('vendas').add({
        produtoId,
        produtoNome: p.nome,
        quantidade: qtd,
        valorUnitario: p.venda,
        valorTotal: p.venda * qtd,
        profissionalId: document.getElementById('vendaProfissional').value || '',
        data: hoje()
      });
      await base.collection('produtos').doc(produtoId).update({
        estoque: (p.estoque ?? 0) - qtd
      });
      document.getElementById('modalVenda').hidden = true;
    });

    document.getElementById('btnFecharVenda').addEventListener('click', () => {
      document.getElementById('modalVenda').hidden = true;
    });

    // ============================================================
    // FINANCEIRO
    // ============================================================
    function montarFiltroMeses() {
      const sel = document.getElementById('filtroMes');
      const opcoes = ['todos'];
      const agora = new Date();
      for (let i = 0; i < 12; i++) {
        const d = new Date(agora.getFullYear(), agora.getMonth() - i, 1);
        const mes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        opcoes.push(mes);
      }
      sel.innerHTML = opcoes.map(m => {
        if (m === 'todos') return '<option value="todos">Todos os períodos</option>';
        const [a, mm] = m.split('-');
        const nome = new Date(a, mm - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
        return `<option value="${m}">${nome.charAt(0).toUpperCase() + nome.slice(1)}</option>`;
      }).join('');
      sel.value = state.filtroMes;
    }

    document.getElementById('filtroMes').addEventListener('change', e => {
      state.filtroMes = e.target.value;
      renderFinanceiro();
    });

    function renderFinanceiro() {
      const mes = state.filtroMes;

      const servicos = state.agendamentos
        .filter(a => a.status === 'concluido')
        .filter(a => mes === 'todos' || mesDe(a.data) === mes)
        .reduce((s, a) => s + (Number(a.valor) || 0), 0);

      const produtos = state.vendas
        .filter(v => mes === 'todos' || mesDe(v.data) === mes)
        .reduce((s, v) => s + (Number(v.valorTotal) || 0), 0);

      document.getElementById('finServicos').textContent = formatarMoeda(servicos);
      document.getElementById('finProdutos').textContent = formatarMoeda(produtos);
      document.getElementById('finTotal').textContent = formatarMoeda(servicos + produtos);
    }

    // ============================================================
    // EQUIPE (ETAPA 1)
    // ============================================================
    function renderEquipe() {
      const lista = document.getElementById('listaProfissionais');
      if (!state.profissionais.length) {
        lista.innerHTML = '<div class="empty">Nenhum profissional cadastrado ainda.<br>Clique em "+ Profissional" para começar.</div>';
        return;
      }
      lista.innerHTML = state.profissionais.map(p => `
        <div class="card">
          <div class="card-row">
            <div>
              <div class="card-title">${p.nome} ${p.isDono ? '👑' : ''}</div>
              <div class="card-sub">${p.cargo || 'Sem cargo'} ${p.telefone ? '· ' + p.telefone : ''}</div>
              <div class="card-sub" style="color:var(--gold); margin-top:4px;">
                ${p.isDono
                  ? '💎 Dono/Gerente — sem comissão'
                  : `Serviço: ${p.comissaoServico ?? 0}% · Produto: ${p.comissaoProduto ?? 0}%`}
              </div>
            </div>
            <button class="btn-outline btn-small" onclick="editarProfissional('${p.id}')">Editar</button>
          </div>
        </div>`).join('');
    }

    document.getElementById('btnAddProfissional').addEventListener('click', () => abrirModalProfissional());

    function abrirModalProfissional(dados = {}) {
      document.getElementById('tituloProfissional').textContent = dados.id ? 'Editar Profissional' : 'Novo Profissional';
      document.getElementById('profId').value = dados.id || '';
      document.getElementById('profNome').value = dados.nome || '';
      document.getElementById('profCargo').value = dados.cargo || '';
      document.getElementById('profTelefone').value = dados.telefone || '';
      document.getElementById('profComServico').value = dados.comissaoServico ?? 40;
      document.getElementById('profComProduto').value = dados.comissaoProduto ?? 10;
      document.getElementById('profIsDono').checked = !!dados.isDono;
      document.getElementById('btnExcluirProfissional').hidden = !dados.id;
      document.getElementById('modalProfissional').hidden = false;
    }

    function editarProfissional(id) {
      const p = state.profissionais.find(x => x.id === id);
      if (p) abrirModalProfissional(p);
    }

    document.getElementById('btnSalvarProfissional').addEventListener('click', async () => {
      const id = document.getElementById('profId').value;
      const dados = {
        nome: document.getElementById('profNome').value.trim(),
        cargo: document.getElementById('profCargo').value.trim(),
        telefone: document.getElementById('profTelefone').value.trim(),
        comissaoServico: Number(document.getElementById('profComServico').value) || 0,
        comissaoProduto: Number(document.getElementById('profComProduto').value) || 0,
        isDono: document.getElementById('profIsDono').checked
      };
      if (!dados.nome) { alert('Informe o nome do profissional.'); return; }
      const base = db.collection('users').doc(state.usuario.uid).collection('profissionais');
      if (id) await base.doc(id).update(dados);
      else await base.add(dados);
      document.getElementById('modalProfissional').hidden = true;
    });

    document.getElementById('btnExcluirProfissional').addEventListener('click', async () => {
      const id = document.getElementById('profId').value;
      if (id && confirm('Excluir este profissional?')) {
        await db.collection('users').doc(state.usuario.uid).collection('profissionais').doc(id).delete();
        document.getElementById('modalProfissional').hidden = true;
      }
    });
    document.getElementById('btnFecharProfissional').addEventListener('click', () => {
      document.getElementById('modalProfissional').hidden = true;
    });

    // ============================================================
    // POPULAR SELECT DE PROFISSIONAIS (agenda e venda)
    // ============================================================
    function popularSelectProfissionais() {
      const selects = [
        document.getElementById('agProfissional'),
        document.getElementById('vendaProfissional')
      ];
      selects.forEach(sel => {
        if (!sel) return;
        const atual = sel.value;
        sel.innerHTML = '<option value="">— Não definido —</option>' +
          state.profissionais.map(p => `<option value="${p.id}">${p.nome}${p.cargo ? ' · ' + p.cargo : ''}</option>`).join('');
        sel.value = atual;
      });
    }
  </script>
</body>
</html>
